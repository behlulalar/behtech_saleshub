# saleshub.behtechlabs.com — BehTech Sales Hub
# Kurulum: deploy/setup-server.sh bu dosyayı /etc/nginx/sites-available/ altına kopyalar

server {
    listen 80;
    server_name saleshub.behtechlabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saleshub.behtechlabs.com;

    ssl_certificate     /etc/letsencrypt/live/saleshub.behtechlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saleshub.behtechlabs.com/privkey.pem;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/behtech-sales-hub/frontend/dist;
    index index.html;

    location ~ ^/api/auth/(login|register|forgot-password|reset-password|verify-email|resend-verification) {
        limit_req zone=behtech_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
