# Mevcut sunucu Nginx'ine EKLEYİN (diğer sitelere dokunmayın)
# Domain: saleshub.behtechlabs.com
# Bu blok yalnızca BehTech Sales Hub'a proxy yapar.

server {
    listen 80;
    server_name saleshub.behtechlabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name saleshub.behtechlabs.com;

    # certbot ile alınmış sertifikalarınızı kullanın
    ssl_certificate     /etc/letsencrypt/live/saleshub.behtechlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saleshub.behtechlabs.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
