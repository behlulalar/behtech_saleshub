# BehTech Sales Hub — izole production stack
# Diğer sistemlerle çakışmaması için:
# - Benzersiz compose project adı (behtech-sales-hub)
# - Benzersiz container, network ve volume isimleri
# - PostgreSQL host'a AÇILMAZ (sadece iç ağ)
# - Web yalnızca 127.0.0.1:APP_HOST_PORT üzerinden dinler (host nginx buraya proxy yapar)

name: behtech-sales-hub

services:
  postgres:
    image: postgres:16-alpine
    container_name: behtech_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-behtech_crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-behtech_crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - behtech_crm_pgdata:/var/lib/postgresql/data
    networks:
      - behtech_crm_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-behtech_crm_user} -d ${POSTGRES_DB:-behtech_crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # DE-6.5 — optional Redis for assistant working memory.
  # Not started by default (profile). Backend does not depend_on redis.
  # Enable later with: docker compose --profile assistant-memory up -d
  # Keep ASSISTANT_MEMORY_ENABLED=false until intentionally enabled.
  redis:
    profiles: ["assistant-memory"]
    image: redis:7-alpine
    container_name: behtech_crm_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - behtech_crm_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: behtech_crm_backend
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-behtech_crm_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-behtech_crm_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - behtech_crm_net
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: behtech_crm_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-18080}:80"
    networks:
      - behtech_crm_net

networks:
  behtech_crm_net:
    name: behtech_crm_net
    driver: bridge

volumes:
  behtech_crm_pgdata:
    name: behtech_crm_pgdata
